name: Wheelocity
description: >-
  Wheelocity (Wheelocity Fresh Private Limited) is a Bangalore, India based
  logistics and supply-chain company building daily fresh-produce and grocery
  delivery networks for underserved rural markets across India, which it frames
  as "the access rails for Bharat commerce." Its phygital (online plus offline)
  model combines location intelligence, IoT hardware, cold-chain and predictive
  demand forecasting with an electric-vehicle first-mile and last-mile fleet and
  a consumer app branded WoW. The company reports serving more than one million
  households, running over 100,000 km of EV movement daily and avoiding tens of
  thousands of kilograms of produce waste each day. Wheelocity is a venture-backed
  operating company (Lightspeed Venture Partners portfolio) and, as of this
  profile, publishes no public developer portal, API documentation, or SDKs.
